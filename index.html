<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saksham Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            jp: ['Space Grotesk', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            // Dark — warm charcoal + amber/coral
            'dark-bg': '#121110',
            'dark-surface': '#1c1a18',
            'dark-text': '#c9c4bd',
            'dark-heading': '#f5f1ea',
            'dark-accent': '#ffb347',
            'dark-accent-2': '#ff6b4a',
            'dark-border': 'rgba(255,255,255,0.08)',
            // Light — warm off-white + deep amber
            'light-bg': '#faf7f2',
            'light-surface': '#ffffff',
            'light-text': '#4a4540',
            'light-heading': '#1c1a18',
            'light-accent': '#e8590c',
            'light-accent-2': '#d1440a',
            'light-border': 'rgba(0,0,0,0.08)',
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
            'gradient': 'gradientShift 8s ease infinite',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            gradientShift: {
              '0%, 100%': { 'background-position': '0% 50%' },
              '50%': { 'background-position': '100% 50%' },
            },
          },
        },
      },
    }
  </script>
  <style>
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    html {
      scroll-behavior: smooth;
    }
    .font-jp, .font-display {
      letter-spacing: -0.02em;
    }
    /* Refined scrollbar */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,179,71,0.35); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,179,71,0.55); }
    ::selection { background: rgba(255,179,71,0.3); }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
    "react/": "https://esm.sh/react@^19.1.1/",
    "react": "https://esm.sh/react@^19.1.1",
    "three": "https://esm.sh/three@0.134.0",
    "animejs": "https://esm.sh/animejs@3.2.1"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-light-bg dark:bg-dark-bg transition-colors duration-500">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
